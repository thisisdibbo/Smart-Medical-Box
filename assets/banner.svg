<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-label="Smart Medical Box banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04262E"/>
      <stop offset="0.55" stop-color="#084A5A"/>
      <stop offset="1" stop-color="#0B6D80"/>
    </linearGradient>
    <linearGradient id="b-body" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18A9BF"/>
      <stop offset="1" stop-color="#0A6072"/>
    </linearGradient>
    <linearGradient id="b-lid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3AD3E3"/>
      <stop offset="1" stop-color="#119AB1"/>
    </linearGradient>
    <linearGradient id="b-drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8CEBFA"/>
      <stop offset="1" stop-color="#2196D4"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="440" fill="url(#bg)"/>

  <!-- faint background ECG -->
  <path d="M0 330 h180 l34 -76 l46 150 l38 -104 l30 30 h120 l34 -62 l44 116 l34 -54 h300
           l34 -76 l46 150 l38 -104 l30 30 h92"
        fill="none" stroke="#7FE6F5" stroke-opacity="0.10" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1420" cy="120" r="200" fill="#17A2B8" opacity="0.07"/>
  <circle cx="120" cy="400" r="150" fill="#17A2B8" opacity="0.06"/>

  <!-- mark -->
  <g transform="translate(96,86) scale(1.12)">
    <rect x="100" y="24" width="56" height="30" rx="14" fill="none" stroke="#0A6072" stroke-width="13"/>
    <rect x="22" y="72" width="212" height="152" rx="30" fill="url(#b-body)"/>
    <rect x="22" y="46" width="212" height="42" rx="21" fill="url(#b-lid)"/>
    <rect x="46"  y="100" width="36" height="72" rx="18" fill="#063A46" opacity="0.40"/>
    <rect x="46"  y="118" width="36" height="54" rx="18" fill="#F2FAFC"/>
    <rect x="110" y="100" width="36" height="72" rx="18" fill="#063A46" opacity="0.40"/>
    <rect x="110" y="106" width="36" height="66" rx="18" fill="#F2FAFC"/>
    <rect x="174" y="100" width="36" height="72" rx="18" fill="#063A46" opacity="0.40"/>
    <rect x="174" y="138" width="36" height="34" rx="17" fill="#FFC24D"/>
    <rect x="42" y="184" width="172" height="30" rx="15" fill="#05323D" opacity="0.52"/>
    <path d="M54 199 h20 l8 -17 l11 34 l9 -23 l7 6 h16 l8 -14 l10 26 l8 -12 h35"
          fill="none" stroke="#FF5E6C" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M215 172 c16 20 24 31 24 41 a24 24 0 0 1 -48 0 c0 -10 8 -21 24 -41 z"
          fill="#04262E" opacity="0.30" transform="translate(3,4)"/>
    <path d="M215 172 c16 20 24 31 24 41 a24 24 0 0 1 -48 0 c0 -10 8 -21 24 -41 z"
          fill="url(#b-drop)"/>
    <ellipse cx="206" cy="216" rx="5.5" ry="8" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <text x="450" y="172" font-family="DejaVu Sans, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="68" font-weight="bold" letter-spacing="1" fill="#FFFFFF">SMART MEDICAL BOX</text>
  <rect x="452" y="194" width="140" height="7" rx="3.5" fill="#FFC24D"/>
  <text x="452" y="248" font-family="DejaVu Sans, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="26" fill="#9FD9E6">Automated pill dispensing · syrup pumping · patient vitals</text>

  <!-- chips -->
  <g font-family="DejaVu Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" fill="#CFEEF5">
    <rect x="452" y="298" width="196" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.10" stroke="#5FC7DA" stroke-opacity="0.35"/>
    <text x="478" y="330">3× pill silos</text>

    <rect x="666" y="298" width="216" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.10" stroke="#5FC7DA" stroke-opacity="0.35"/>
    <text x="692" y="330">2× syrup pumps</text>

    <rect x="900" y="298" width="228" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.10" stroke="#5FC7DA" stroke-opacity="0.35"/>
    <text x="926" y="330">HR / SpO₂ / temp</text>

    <rect x="1146" y="298" width="234" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.10" stroke="#5FC7DA" stroke-opacity="0.35"/>
    <text x="1172" y="330">Web dashboard</text>
  </g>
</svg>
