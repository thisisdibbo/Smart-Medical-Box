<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Smart Medical Box mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="smb-body" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#18A9BF"/>
      <stop offset="1" stop-color="#0A6072"/>
    </linearGradient>
    <linearGradient id="smb-lid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3AD3E3"/>
      <stop offset="1" stop-color="#119AB1"/>
    </linearGradient>
    <linearGradient id="smb-drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8CEBFA"/>
      <stop offset="1" stop-color="#2196D4"/>
    </linearGradient>
  </defs>

  <!-- carry handle -->
  <rect x="100" y="24" width="56" height="30" rx="14" fill="none" stroke="#0A6072" stroke-width="13"/>

  <!-- body -->
  <rect x="22" y="72" width="212" height="152" rx="30" fill="url(#smb-body)"/>
  <!-- lid -->
  <rect x="22" y="46" width="212" height="42" rx="21" fill="url(#smb-lid)"/>

  <!-- three pill silos with fill levels -->
  <g>
    <rect x="46"  y="100" width="36" height="72" rx="18" fill="#063A46" opacity="0.40"/>
    <rect x="46"  y="118" width="36" height="54" rx="18" fill="#F2FAFC"/>

    <rect x="110" y="100" width="36" height="72" rx="18" fill="#063A46" opacity="0.40"/>
    <rect x="110" y="106" width="36" height="66" rx="18" fill="#F2FAFC"/>

    <rect x="174" y="100" width="36" height="72" rx="18" fill="#063A46" opacity="0.40"/>
    <rect x="174" y="138" width="36" height="34" rx="17" fill="#FFC24D"/>
  </g>

  <!-- vitals strip -->
  <rect x="42" y="184" width="172" height="30" rx="15" fill="#05323D" opacity="0.52"/>
  <path d="M54 199 h20 l8 -17 l11 34 l9 -23 l7 6 h16 l8 -14 l10 26 l8 -12 h35"
        fill="none" stroke="#FF5E6C" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- water / syrup droplet -->
  <path d="M215 172 c16 20 24 31 24 41 a24 24 0 0 1 -48 0 c0 -10 8 -21 24 -41 z"
        fill="#04262E" opacity="0.30" transform="translate(3,4)"/>
  <path d="M215 172 c16 20 24 31 24 41 a24 24 0 0 1 -48 0 c0 -10 8 -21 24 -41 z"
        fill="url(#smb-drop)"/>
  <ellipse cx="206" cy="216" rx="5.5" ry="8" fill="#FFFFFF" opacity="0.55"/>
</svg>
